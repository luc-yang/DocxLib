[pytest]
# Pytest configuration for DocxLib

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when using pytest-cov)
# addopts = --cov=docxlib --cov-report=html --cov-report=term

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    windows: Tests that only run on Windows

# Ignore paths
norecursedirs = .git .venv __pycache__ *.egg-info build dist

# Logging
log_cli = false
log_cli_level = INFO

# Warning settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
